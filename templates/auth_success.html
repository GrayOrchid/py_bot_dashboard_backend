<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Авторизация успешна</title>
</head>
<body style="background: #313338; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0;">

    <div style="text-align: center;">
        <h2>Успешно!</h2>
        <p>Вы вошли как {{ user_name }}</p>
        <p style="color: #b5bac1; font-size: 14px;">Это окно закроется автоматически.</p>
    </div>

    <script>
        const payload = {
            token: "{{ access_token }}",
            user: {{ user_data | tojson }}
        };

        window.opener.postMessage(
            { type: "AUTH_SUCCESS", payload: payload },
            "http://localhost:5173"
        );

        setTimeout(() => window.close(), 500);
    </script>
</body>
</html>
